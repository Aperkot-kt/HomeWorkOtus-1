server:
  port: 8080

management:
  endpoint:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: info,env,health

spring:
  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    use-root-path: true
    urls:
      - name: v1
        url: /parcel-delivery-v1-api.yaml

parcel-delivery:
  repo:
    type: postgres
    config:
      host: localhost
      port: 5432
      user: postgres
      password: pd-pass
      database: pd_pds