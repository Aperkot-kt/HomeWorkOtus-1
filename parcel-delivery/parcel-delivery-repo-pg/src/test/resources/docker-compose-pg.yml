version: '3.9'
services:
  psql:
    image: postgres
    environment:
      POSTGRES_PASSWORD: "pd-pass"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "pd_pds"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  liquibase:
    image: "pd-migration-pg:0.0.1"
    environment:
      LIQUIBASE_URL:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://psql:5432/pd_pds
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: "pd-pass"
      LIQUIBASE_LIQUIBASE_SCHEMA_NAME: public
#      tableName: pds

    depends_on:
      psql:
        condition: service_healthy
